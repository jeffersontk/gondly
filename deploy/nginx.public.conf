server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(blog|receitas|guias|sobre|privacy|terms|contact)(/|$) {
        try_files $uri/index.html $uri =404;
        error_page 404 /editorial-404.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /editorial-404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    location = /app-shell.html {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        return 301 /;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Current app routes and the older links still accepted by React Router.
    location ~ ^/(app|login|invite|shared|home|lists|purchase|history|compare|prices|markets|products|insights|billing|settings|tutorial)(/|$) {
        try_files /app-shell.html =404;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/(ads\.txt|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri =404;
        error_page 404 /editorial-404.html;
        add_header Cache-Control "no-cache";
    }
}
