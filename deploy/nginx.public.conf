server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dynamic published recipes: fresh database content, no rebuild or public cache.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /receitas {
        set $recipe_api gondly-prod-api:3333;
        proxy_pass http://$recipe_api/public-recipe-pages$is_args$args;
    }
    location ^~ /receitas/ {
        set $recipe_api gondly-prod-api:3333;
        rewrite ^/receitas/(.*)$ /public-recipe-pages/$1 break;
        proxy_pass http://$recipe_api;
    }
    location = /sitemap-recipes.xml {
        set $recipe_api gondly-prod-api:3333;
        proxy_pass http://$recipe_api/public-recipe-pages/sitemap.xml;
    }

    location ~ ^/(blog|receitas|guias|sobre|privacy|terms|contact)(/|$) {
        try_files $uri/index.html $uri =404;
        error_page 404 /editorial-404.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /editorial-404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    location = /app-shell.html {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        return 301 /;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Current app routes and the older links still accepted by React Router.
    location ~ ^/(app|login|invite|shared|home|lists|purchase|history|compare|prices|markets|products|insights|billing|settings|tutorial)(/|$) {
        try_files /app-shell.html =404;
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/(ads\.txt|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri =404;
        error_page 404 /editorial-404.html;
        add_header Cache-Control "no-cache";
    }
}
