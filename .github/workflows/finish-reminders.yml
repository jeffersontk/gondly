name: Finish purchase reminders

on:
  schedule:
    # Every 10 minutes from 07:00 to 22:59 in São Paulo (UTC-3), i.e. 10:00–01:59 UTC.
    # GitHub may delay scheduled runs by a few minutes; reminders tolerate that.
    - cron: "*/10 10-23,0-1 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run finish-purchase reminders
        env:
          API_URL: ${{ secrets.GONDLY_API_URL }}
          CRON_SECRET: ${{ secrets.GONDLY_CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "GONDLY_API_URL / GONDLY_CRON_SECRET not configured; skipping."
            exit 0
          fi
          # A sleeping free Render instance can take ~1 minute to wake up, hence the retries and long timeout.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -X POST "$API_URL/push/reminders/run" \
            -H "x-cron-secret: $CRON_SECRET"
